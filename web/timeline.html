<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:;">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>astral.nvim — semantic diff timeline</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #1a1b26;
        color: #c0caf5;
        font-family: "JetBrains Mono", "Fira Code", monospace;
        padding: 0;
        min-height: 100vh;
      }

      nav {
        background: #16161e;
        border-bottom: 1px solid #2a2b3d;
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 10;
      }

      nav h1 {
        font-size: 1rem;
        color: #7aa2f7;
        letter-spacing: 0.05em;
      }

      nav h1 span {
        color: #565f89;
        font-weight: normal;
      }

      .meta {
        font-size: 0.75rem;
        color: #565f89;
      }

      .meta strong {
        color: #c0caf5;
      }

      .stats {
        display: flex;
        gap: 1rem;
        padding: 1.5rem 2rem;
        border-bottom: 1px solid #2a2b3d;
      }

      .stat {
        padding: 0.5rem 1rem;
        border-radius: 6px;
        font-size: 0.8rem;
        background: #1f2030;
        border: 1px solid #2a2b3d;
      }

      .stat.added {
        border-left: 3px solid #9ece6a;
      }
      .stat.removed {
        border-left: 3px solid #f7768e;
      }
      .stat.modified {
        border-left: 3px solid #e0af68;
      }

      .stat .count {
        font-size: 1.2rem;
        font-weight: bold;
        display: block;
      }

      .stat.added .count {
        color: #9ece6a;
      }
      .stat.removed .count {
        color: #f7768e;
      }
      .stat.modified .count {
        color: #e0af68;
      }

      .stat .label {
        color: #565f89;
        font-size: 0.7rem;
      }

      .timeline {
        padding: 2rem;
        position: relative;
      }

      .timeline::before {
        content: "";
        position: absolute;
        left: 2.9rem;
        top: 0;
        bottom: 0;
        width: 2px;
        background: #2a2b3d;
      }

      /* Filter controls */
      .controls {
        display: flex;
        gap: 0.5rem;
        padding: 1rem 2rem;
        border-bottom: 1px solid #2a2b3d;
        flex-wrap: wrap;
      }

      .filter-btn {
        padding: 0.3rem 0.8rem;
        border-radius: 4px;
        border: 1px solid #2a2b3d;
        background: #1f2030;
        color: #c0caf5;
        font-family: inherit;
        font-size: 0.75rem;
        cursor: pointer;
        transition: all 0.15s;
      }

      .filter-btn:hover {
        border-color: #3b4261;
      }

      .filter-btn.active {
        border-color: #7aa2f7;
        background: #2a2b3d;
      }

      .filter-btn[data-filter="all"].active { border-color: #7aa2f7; }
      .filter-btn[data-filter="ADDED"].active { border-color: #9ece6a; color: #9ece6a; }
      .filter-btn[data-filter="REMOVED"].active { border-color: #f7768e; color: #f7768e; }
      .filter-btn[data-filter="MODIFIED"].active { border-color: #e0af68; color: #e0af68; }

      .search-input {
        padding: 0.3rem 0.8rem;
        border-radius: 4px;
        border: 1px solid #2a2b3d;
        background: #1f2030;
        color: #c0caf5;
        font-family: inherit;
        font-size: 0.75rem;
        outline: none;
        margin-left: auto;
        width: 200px;
      }

      .search-input:focus {
        border-color: #7aa2f7;
      }

      .search-input::placeholder {
        color: #565f89;
      }

      .event {
        position: relative;
        margin-bottom: 1.2rem;
        padding: 1rem 1.2rem;
        border-radius: 8px;
        border: 1px solid #2a2b3d;
        background: #1f2030;
        margin-left: 2rem;
        transition: border-color 0.2s;
      }

      .event:hover {
        border-color: #3b4261;
      }

      .event::before {
        content: "";
        position: absolute;
        left: -1.6rem;
        top: 1.1rem;
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }

      .event.ADDED::before {
        background: #9ece6a;
      }
      .event.REMOVED::before {
        background: #f7768e;
      }
      .event.MODIFIED::before {
        background: #e0af68;
      }

      .event.ADDED {
        border-left: 3px solid #9ece6a;
      }
      .event.REMOVED {
        border-left: 3px solid #f7768e;
      }
      .event.MODIFIED {
        border-left: 3px solid #e0af68;
      }

      .event-header {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 0.4rem;
      }

      .badge {
        font-size: 0.65rem;
        font-weight: bold;
        padding: 0.15rem 0.5rem;
        border-radius: 4px;
        letter-spacing: 0.05em;
      }

      .badge.ADDED {
        background: #9ece6a;
        color: #1a1b26;
      }
      .badge.REMOVED {
        background: #f7768e;
        color: #1a1b26;
      }
      .badge.MODIFIED {
        background: #e0af68;
        color: #1a1b26;
      }

      .event-name {
        font-size: 0.95rem;
        color: #c0caf5;
        font-weight: bold;
      }

      .event-description {
        font-size: 0.8rem;
        color: #565f89;
        margin-top: 0.2rem;
      }

      .event-line {
        font-size: 0.7rem;
        color: #3b4261;
        margin-top: 0.4rem;
      }

      .empty {
        text-align: center;
        color: #565f89;
        padding: 4rem;
        font-size: 0.9rem;
      }

      footer {
        text-align: center;
        padding: 2rem;
        color: #3b4261;
        font-size: 0.75rem;
        border-top: 1px solid #2a2b3d;
      }

      footer a {
        color: #7aa2f7;
        text-decoration: none;
      }

      footer a:hover {
        text-decoration: underline;
      }

      /* Responsive */
      @media (max-width: 768px) {
        nav {
          padding: 0.8rem 1rem;
          flex-direction: column;
          gap: 0.5rem;
        }

        .stats {
          padding: 1rem;
        }

        .controls {
          padding: 0.8rem 1rem;
        }

        .search-input {
          width: 100%;
          margin-left: 0;
          margin-top: 0.5rem;
        }

        .timeline {
          padding: 1rem;
        }

        .timeline::before {
          left: 1.4rem;
        }

        .event {
          margin-left: 1rem;
          padding: 0.8rem;
        }

        .event::before {
          left: -1.1rem;
        }
      }

      @media (max-width: 480px) {
        .stats {
          flex-direction: column;
          gap: 0.5rem;
        }

        .stat {
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
      }
    </style>
  </head>
<body>
  <nav>
    <h1>⬡ astral<span>.nvim</span></h1>
    <span class="meta" id="meta">loading...</span>
  </nav>

  <div class="stats" id="stats"></div>
  <div class="controls" id="controls">
    <button class="filter-btn active" data-filter="all">all</button>
    <button class="filter-btn" data-filter="ADDED">added</button>
    <button class="filter-btn" data-filter="REMOVED">removed</button>
    <button class="filter-btn" data-filter="MODIFIED">modified</button>
    <input type="text" class="search-input" id="search" placeholder="filter events...">
  </div>
  <div class="timeline" id="timeline"></div>

  <footer>
    generated by <a href="https://github.com/xd0pa/astral.nvim" target="_blank" rel="noopener noreferrer">astral.nvim</a>
  </footer>

  <script>
    // HTML-escape helper to prevent XSS
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(String(str)));
      return div.innerHTML;
    }

    var SESSION = __SESSION_DATA__;

    var meta = document.getElementById("meta");
    var stats = document.getElementById("stats");
    var controls = document.getElementById("controls");
    var timeline = document.getElementById("timeline");
    var searchInput = document.getElementById("search");
    var currentFilter = "all";
    var currentSearch = "";

    if (!SESSION || !SESSION.events || SESSION.events.length === 0) {
      meta.textContent = "no session data found";
      controls.style.display = "none";
      timeline.innerHTML = '<p class="empty">no semantic events to display — run :SemanticDiff first</p>';
    } else {
      // Header meta
      var file = SESSION.filepath.split("/").pop();
      meta.innerHTML = "<strong>" + escapeHtml(file) + "</strong> vs " + escapeHtml(SESSION.ref);

      // Count by type
      var counts = { ADDED: 0, REMOVED: 0, MODIFIED: 0 };
      SESSION.events.forEach(function(e) { counts[e.type]++; });

      stats.innerHTML =
        '<div class="stat added">' +
          '<span class="count">' + counts.ADDED + '</span>' +
          '<span class="label">added</span>' +
        '</div>' +
        '<div class="stat removed">' +
          '<span class="count">' + counts.REMOVED + '</span>' +
          '<span class="label">removed</span>' +
        '</div>' +
        '<div class="stat modified">' +
          '<span class="count">' + counts.MODIFIED + '</span>' +
          '<span class="label">modified</span>' +
        '</div>';

      // Render events with XSS-safe textContent
      function renderEvents() {
        timeline.innerHTML = "";
        var filtered = SESSION.events.filter(function(event) {
          var matchesFilter = currentFilter === "all" || event.type === currentFilter;
          var matchesSearch = currentSearch === "" ||
            (event.name && event.name.toLowerCase().indexOf(currentSearch) !== -1) ||
            (event.description && event.description.toLowerCase().indexOf(currentSearch) !== -1);
          return matchesFilter && matchesSearch;
        });

        if (filtered.length === 0) {
          timeline.innerHTML = '<p class="empty">no events match the current filter</p>';
          return;
        }

        filtered.forEach(function(event) {
          var div = document.createElement("div");
          div.className = "event " + event.type;
          div.setAttribute("data-type", event.type);

          var header = document.createElement("div");
          header.className = "event-header";

          var badge = document.createElement("span");
          badge.className = "badge " + event.type;
          badge.textContent = event.type;

          var name = document.createElement("span");
          name.className = "event-name";
          name.textContent = event.name;

          header.appendChild(badge);
          header.appendChild(name);

          var desc = document.createElement("div");
          desc.className = "event-description";
          desc.textContent = event.description;

          div.appendChild(header);
          div.appendChild(desc);

          if (event.line > 0) {
            var lineInfo = document.createElement("div");
            lineInfo.className = "event-line";
            lineInfo.textContent = "line " + event.line;
            div.appendChild(lineInfo);
          }

          timeline.appendChild(div);
        });
      }

      // Filter buttons
      document.querySelectorAll(".filter-btn").forEach(function(btn) {
        btn.addEventListener("click", function() {
          document.querySelectorAll(".filter-btn").forEach(function(b) { b.classList.remove("active"); });
          btn.classList.add("active");
          currentFilter = btn.getAttribute("data-filter");
          renderEvents();
        });
      });

      // Search input
      searchInput.addEventListener("input", function() {
        currentSearch = searchInput.value.toLowerCase();
        renderEvents();
      });

      // Initial render
      renderEvents();
    }
  </script>
</body>
</html>
